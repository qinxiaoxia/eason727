{% extends "base.html" %}
{% block title %}登录 · 网安情报{% endblock %}
{% block body %}
<div class="login-box">
  <h1 style="margin:0 0 6px;font-size:1.2rem">网安情报</h1>
  <p class="muted">内部访问，请输入口令</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="访问口令" autofocus required/>
    <button class="btn primary" type="submit" style="width:100%">进入</button>
  </form>
</div>
{% endblock %}
