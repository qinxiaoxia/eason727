# RSS 推送到企业微信（轮巡）
# - 北京 6、18 整点轮巡（12:00 仅走定时档，避免双跑）；实时两类（20:00–次日 6:00 静默不推）
# - 北京 9:30 / 12:00 / 15:30 / 17:30 定时档：见 rss-push-timed.yml（与轮巡拆分）
# - 推送后标记已推送，避免重复
# Secrets: WECHAT_WEBHOOK, FEEDS_JSON (必填) | LLM_* / OSS_* / WECHAT_REGULATORY_MENTION_USERIDS (可选)
name: RSS Push

on:
  # 轮巡由 Zeabur（zeabur-cron-trigger）按北京时间触发 workflow_dispatch，不用 GitHub schedule（不稳定）
  workflow_dispatch:
  repository_dispatch:   # 仍可用 API 自定义触发

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 保证后续 git pull --rebase 正常（默认 depth=1 偶发 rebase 问题）
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r rss-wechat-pusher/requirements.txt

      - name: Run RSS Push
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          WECHAT_WEBHOOK_COLLECTOR: ${{ secrets.WECHAT_WEBHOOK_COLLECTOR }}
          WECHAT_COLLECTOR_BOT_ID: ${{ secrets.WECHAT_COLLECTOR_BOT_ID }}
          WECHAT_COLLECTOR_BOT_SECRET: ${{ secrets.WECHAT_COLLECTOR_BOT_SECRET }}
          WECHAT_REGULATORY_MENTION_USERIDS: ${{ secrets.WECHAT_REGULATORY_MENTION_USERIDS }}
          FEEDS_JSON: ${{ secrets.FEEDS_JSON }}
          # 可选：FreeBuf 在 Actions 出口 IP 上常 405，填自建 RSSHub 等镜像全文 URL（如 https://rsshub.xxx/freebuf/articles/web）
          FREEBUF_RSS_MIRROR: ${{ secrets.FREEBUF_RSS_MIRROR }}
          WEWE_RSS_URL: ${{ secrets.WEWE_RSS_URL }}
          LLM_MODELS_JSON: ${{ secrets.LLM_MODELS_JSON }}
          LLM_IOC_MODELS_JSON: ${{ secrets.LLM_IOC_MODELS_JSON }}
          LLM_TRANSLATE_MODELS_JSON: ${{ secrets.LLM_TRANSLATE_MODELS_JSON }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SUMMARY_PREVIEW_ENABLED: ${{ secrets.SUMMARY_PREVIEW_ENABLED }}
          SUMMARY_PREVIEW_BASE_URL: ${{ secrets.SUMMARY_PREVIEW_BASE_URL }}
          SUMMARY_PREVIEW_SHARECODE: ${{ secrets.SUMMARY_PREVIEW_SHARECODE }}
          # 英文摘要外链：阿里云 OSS（桶公共读）
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
          OSS_PUBLIC_BASE_URL: ${{ secrets.OSS_PUBLIC_BASE_URL }}
          OSS_KB_PREFIX: ${{ secrets.OSS_KB_PREFIX }}
          OSS_BRIEF_PREFIX: ${{ secrets.OSS_BRIEF_PREFIX }}
          NOISE_LLM_REVIEW: "1"
          # 强制轮巡：避免 12:00 等与定时档重叠时被 _get_run_mode 误判为 scheduled
          RSS_PUSH_MODE: poll
          PUSH_SCHEDULED_NOW: ""
          GENERATE_DAILY_BRIEF: ${{ secrets.GENERATE_DAILY_BRIEF }}
        run: |
          cd rss-wechat-pusher
          cp config.example.py config.py
          # 北京 18:00 轮巡（入库+实时两类推送）结束后出每日要点 PDF；同日只发一次
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ -z "$GENERATE_DAILY_BRIEF" ] && [ "$HOUR" = "18" ]; then
            export GENERATE_DAILY_BRIEF=1
          fi
          python main.py

      - name: Commit pushed state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rss-wechat-pusher/rss_push.db 2>/dev/null || true
          git add rss-wechat-pusher/translated/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无 db/摘要 变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update rss push state and translated summaries"
          # 远端可能在此期间有新提交（你本地 push 等），先 rebase 再推避免 rejected
          git pull --rebase origin main
          git push origin main
